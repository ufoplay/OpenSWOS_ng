[workspace]
# One crate per file format under src/resources (docs/PLAN.md §4).
members = [
    "src/common",
    "src/core",
    "src/game_style",
    "src/math",
    "src/oracle",
    "src/resources/*",
    "src/rng",
    "src/test_utils",
    "src/tools/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"
authors = ["Francesco Cina <ufoscout@gmail.com>"]
homepage = "https://github.com/ufoplay/OpenSWOS_ng"
repository = "https://github.com/ufoplay/OpenSWOS_ng"

[workspace.dependencies]
# Core
openswos_common = { path = "src/common", version = "0.1.0" }
openswos_core = { path = "src/core", version = "0.1.0" }
openswos_game_style = { path = "src/game_style", version = "0.1.0" }
openswos_math = { path = "src/math", version = "0.1.0" }
openswos_rng = { path = "src/rng", version = "0.1.0" }
openswos_test_utils = { path = "src/test_utils" }

# Resources
openswos_career_params_json_resource = { path = "src/resources/career_params_json", version = "0.1.0" }
openswos_career_save_resource = { path = "src/resources/career_save", version = "0.1.0" }
openswos_competition_save_resource = { path = "src/resources/competition_save", version = "0.1.0" }
openswos_competitions_json_resource = { path = "src/resources/competitions_json", version = "0.1.0" }
openswos_national_teams_json_resource = { path = "src/resources/national_teams_json", version = "0.1.0" }
openswos_hil_resource = { path = "src/resources/hil", version = "0.1.0" }
openswos_settings_ini_resource = { path = "src/resources/settings_ini", version = "0.1.0" }
openswos_poolplyr_resource = { path = "src/resources/poolplyr", version = "0.1.0" }
openswos_rgd_resource = { path = "src/resources/rgd", version = "0.1.0" }
openswos_srp_resource = { path = "src/resources/srp", version = "0.1.0" }
openswos_save_json_resource = { path = "src/resources/save_json", version = "0.1.0" }
openswos_tac_resource = { path = "src/resources/tac", version = "0.1.0" }
openswos_tactics_json_resource = { path = "src/resources/tactics_json", version = "0.1.0" }
openswos_team_json_resource = { path = "src/resources/team_json", version = "0.1.0" }
openswos_team_resource = { path = "src/resources/team", version = "0.1.0" }
openswos_tmd_resource = { path = "src/resources/tmd", version = "0.1.0" }
openswos_world_package_resource = { path = "src/resources/world_package", version = "0.1.0" }
openswos_world_rules_resource = { path = "src/resources/world_rules", version = "0.1.0" }

# Tools (the oracle is test-only: only world_extract links it, docs/PLAN.md §4)
openswos_oracle = { path = "src/oracle" }
openswos_upstream = { path = "src/tools/upstream" }

# The player flags of the team records.
bindgen = "0.72"
bitflags = { version = "2", features = ["serde"] }
cc = "1"
clap = { version = "4", features = ["derive"] }
# Decompresses the swos-port match recordings (.RGD.gz); the zip crate's backend.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Glob patterns over upstream paths (the migration ledger tool).
globset = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The team checksums of the team JSON (upstream docs/TEAM_IDS.md).
sha1 = "0.11"
# Verifies downloaded test data (test_utils' download cache).
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
# Writes upstream.toml with one inline table per file.
toml_edit = "0.25"
# HTTP client of test_utils' download cache (docs/PLAN.md §6, D8).
ureq = "3"
# The team and player ids of the team JSON: derived ones are UUID v5.
uuid = { version = "1", features = ["serde", "v5"] }
# Reads world package zips (World 2026-27's download); decompression only.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"

[profile.dev]
debug = "line-tables-only"

# Dependencies (not workspace members) are optimised in dev/test builds: proptest-heavy
# tests run much faster this way.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
opt-level = 2
