# The upstream C the oracle compiles (docs/PLAN.md §7.3): files of the pinned checkout,
# unchanged, built as upstream's SDL build builds them (its Makefile's `CFLAGS` and defaults,
# 64-bit as its `X86_64=1`, macOS and aarch64 builds).

[build]
# The dialect and code generation (`CFLAGS`). `-fexceptions` is the oracle's own: a Rust
# panic (the stub of `PanicHaltLoop`) unwinds through the C frames.
flags = ["-std=gnu11", "-fno-strict-aliasing", "-fno-builtin", "-fexceptions"]
# `-O2`, as upstream.
optimization = 2
# The defines at the Makefile's defaults (`DEBUG_FLAGS`, `DATA_FLAGS`).
defines = [
    "_FILE_OFFSET_BITS=64",
    "SWOS_TEST_RULES=1",
    "SWOS_WORLDS=1",
    "SWOS_ONLINE_CLIENT=0",
    "SWOS_SAVE_FORMAT_JSON=1",
    "SWOS_SAVE_FORMAT_JSON_VERIFY=1",
    "COMPETITION_DATA_C=1",
    "TACTICS_DATA_C=1",
    "FIXTURE_DATA_C=1",
    "SIMULATION_DATA_C=1",
    "PLAYER_DATA_C=1",
    "RENDER_DATA_C=1",
    "PALETTE_DATA_C=1",
    "STRINGS_DATA_C=1",
    "GENERAL_DATA_C=1",
]
# Force-included before every unit (`-include`): it defines `SWOS_SDL_BUILD`.
include = "include/swos_platform.h"
include_dirs = ["src", "include"]
# Upstream's functions the oracle's stubs replace (`ffi::stubs`): their definitions are made weak
# (`#pragma weak`, a header force-included), so the stubs link. `VerifyTeamLoaded`
# (src/career_teams.c) gives the tests' teams; the career's post-match form changes and its
# updates after a match do nothing, and whether a simulated match's statuses apply is the
# test's (src/career_status.c, M7); the tactics' release (src/tactics_data.c
# `TacticsData_SelectRelease`) is recorded, the table left as compiled.
replaced = [
    "VerifyTeamLoaded",
    "Career_ApplyPostMatchPlayerStatModsIfCareerTeam",
    "ShouldApplyRandomPlayerStatusAfterSim",
    "Career_UpdateStatsAfterMatch",
    "UpdateCareerPlayersFormAfterMatch",
    "TacticsData_SelectRelease",
]

# The units the tests call: their functions, the globals they read and write (by name), the
# constants they see (by pattern) and the types read that nothing bound reaches (by name), bound
# by bindgen into `ffi::bindings::<file name>`.

[[unit]]
path = "src/random.c"
functions = ["Rand", "Rand2", "GetRandomWord", "SaveRand2State", "RestoreRand2State"]
variables = [
    "_kRandomTable",
    "_seed",
    "_randXorIndex",
    "_randXorKey",
    "_savedRandState",
    "_savedRandStatePtr",
]

# `Randomize2` only: the file's other functions are the view's.
[[unit]]
path = "src/game_utils.c"
functions = ["Randomize2"]
variables = []

[[unit]]
path = "src/math68k.c"
functions = ["CalculateDeltaXAndY"]
variables = []

# The game styles. The `_k*` constants it writes are upstream's data
# (src/swos_amiga_data_imports.c).
[[unit]]
path = "src/dos_gameplay.c"
functions = ["ApplyGameStyle", "Gameplay_SetStyle", "Gameplay_StyleName", "DosGameplay_TargetFps"]
variables = [
    "_gGameplayStyle",
    "_gDosKeepers",
    "_gameplayStyleOption",
    "_gMoveDeltaScaleNum",
    "_gMoveDeltaScaleDen",
    "_gsKeeperLooseBallMinDeltaZ",
    "_gsFramesPerGameSecond",
    "_gsEndGameCounter",
    "_gsBallDefensiveZ",
    "_gsPenaltyTimer",
    "_gsPenaltiesKeeperFree",
    "_gsHalftimeStoppage",
    "_gsBallOutOfGameTimer",
    "_gsResultAutoAdvance",
    "_gsKickoffStoppage",
    "_gsStoppageEventReload",
    "_gsResultHalftimeLength",
    "_gsResultBreakLength",
    "_gsSubsMovementDelay",
    "_gsCameraLeavingSubs",
    "_gsPlayerDownTimer",
    "_gsThrowInHideResult",
    "_gsStoppageShowerPan",
    "_gsStoppageHalfEnded",
    "_gsStoppageHalftime",
    "_gsStoppageGameOver",
    "_kKeeperSaveDistance",
    "_kGoalkeeperDiveDeltas",
    "_kBallGroundConstant",
    "_kBallAirConstant",
    "_kGravityConstant",
    "_kPitchBallSpeedInfluence",
]
constants = ["GAMEPLAY_.*", "TWEAK_STRONGER_GOALKEEPER_AI"]

# World 2026-27's baked tables (generated by scripts/world_import.py): its install over 96/97's
# records and its accessors, for `world_extract`'s completion (`tables::world_2627`). The
# install writes 96/97's tables: a process that runs it tests nothing else.
[[unit]]
path = "src/world_data.c"
functions = [
    "WorldData2627_InstallBaked",
    "WorldData2627_SeasonCountries",
    "WorldData2627_SecondFile",
    "WorldData2627_SquadNumbers",
    "WorldData2627_LeaguePhaseCups",
    "WorldData2627_Cups",
]
variables = []
# A world cup's record, behind `WorldCup.record` (a `void *`).
types = ["CompetitionCup"]

# The real match days of a world's odd-sized leagues (MIT, the SWOS 96/97 Mod's): World 2026-27's
# install rewrites the odd round robins with it, and `world_extract` reads the result
# (`tables::world_2627`). The pointer table it writes is the oracle's (`ffi::stubs`).
[[unit]]
path = "src/fixture_rounds.c"
functions = ["FixtureRounds_Install", "FixtureRounds_Real"]
variables = []

# The DIY competition engine, a function at a time as M5 ports it: the league table's sort
# (`table`), the teams' values and the draws (`draw`). Its other references are to functions no
# bound one reaches: the linker drops them with the functions that make them (function
# sections, `--gc-sections`), so only what the bound functions reach is stubbed (`ffi::stubs`:
# a world's league phase and split, the loaded teams).
[[unit]]
path = "src/diy_competition.c"
functions = [
    "DIY_SortLeagueTableByStandings",
    "GetAveragePlayerPrice",
    "DIY_ComputeAverageTeamStrengthTier",
    "DIY_ShuffleTeams",
    "DIY_SortAndShuffleTeamsByValue",
    "DIY_ShuffleLeagueTeamOrder",
    "DIY_ShuffleTeamOrderList",
    "DIY_ShuffleTeamGridPairs",
    "InitDIYCompetitionFromTableEntry",
    "InitDIYCupFromRecord",
    "InitDIYTournament",
    "DIYTournament_RecalculateMatchesPerTeam",
    "InitDIYLeagueFromRecord",
    "DIY_PlayOrSimulateLeagueFixture",
    "DIY_GetCurrentFixtureTeamPtrs",
    "DIY_AdvanceLeagueProgressAfterMatch",
    "DIY_UpdateLeagueQualifiers",
    "DIY_UpdatePromotionRelegationScratchCounts",
    "ProcessDIYKnockoutMatchResultAndCareerUpdates",
    "DIY_PlayCupMatchAndAdvance",
    "DIY_UpdateCompetitionProgress",
    "GetCupRoundStringIndex",
    "GetNextCupRoundStringIndex",
    "CountNearnessFactor",
]
variables = [
    "_diyCompetitionStart",
    "_diyFileBufferCopy",
    "_selectedTeams",
    "_careerTeam",
    "_fixtureTeam1CompPtr",
    "_fixtureTeam2CompPtr",
]
# The tournament's state the shuffles take behind a byte pointer; the league and cup records a
# league is started from; the play-off records a cup is started from; the tournament records.
types = ["DIYTournamentState", "CompetitionLeague", "CompetitionCup", "Playoffs", "CompetitionTournament"]

# The career's side of a tournament (`DIY_AdvanceToNextCompetitionSlot`: a stage's end and the
# next loaded); its other functions are the career's (M7).
[[unit]]
path = "src/career_teams.c"
functions = ["DIY_AdvanceToNextCompetitionSlot"]
variables = []

# The simulation of a match nobody plays, a function at a time as M5 #8 ports it: a player's
# match value and the team's strength (#8a); its standing, its form, its players' status buckets
# (#8b); the result, its extra time and its shoot-out (#8c). The result's three are renamed
# `upstream_*`: the oracle's stubs of their names give the competitions' tests the results they
# set, or upstream's when a test asks (`ffi::stubs`).
[[unit]]
path = "src/match_sim.c"
functions = [
    "GetPlayerPrice",
    "UpdatePlayerPositionAndReturnRole",
    "ComputeOldPlayerSkillForViewResult",
    "CalcTeamPriceRankPercentOffset",
    "CalcTeamViewOffset",
    "InitPlayerRemapTableForTeam",
    "CalculateViewResult",
    "ExtraTimeSecondPhaseScoring",
    "PenaltyShootoutScorerPair",
]
renamed = ["CalculateViewResult", "ExtraTimeSecondPhaseScoring", "PenaltyShootoutScorerPair"]
variables = ["_currentMatchPlayers", "_teamSkillCurrent"]

# The career's players' status: whether a player is available (`IsPlayerInjured`), the available
# players and goalkeepers (#8b); the countdown of a simulated match's teams' statuses (#8d),
# renamed `upstream_*`: the oracle's stub of its name runs it when a test asks for upstream's
# simulation (`ffi::stubs`). The rest is the career's (M7).
[[unit]]
path = "src/career_status.c"
functions = [
    "IsPlayerInjured",
    "GetNumberOfAvailablePlayers",
    "GetNumberOfAvailableSubstitutes",
    "InitInGameTeams_WithMatchParam",
]
renamed = ["InitInGameTeams_WithMatchParam"]
variables = []

# The testers' rule (no injuries or cards: SWOS.ini's `[testing] no_injuries_cards`).
[[unit]]
path = "src/test_rules.c"
functions = ["TestRules_SetSetting", "TestRules_Force"]
variables = []

# The menus' formations: each formation's outfield players by how defensive they are
# (`InitializeTacticsPositions`), which a simulated result's stand-ins take their places by.
[[unit]]
path = "src/menus.c"
functions = ["InitializeTacticsPositions"]
variables = ["_playersPositionsByTactics"]

# The rules library (src/rules/, MIT: Davide Lorigliola's, src/rules/LICENSE-MIT), built as
# upstream builds it, through its src/swos_rules_*.c: the season's moves (`sr_post`), a cup's
# clubs (`sr_cups`), parallel groups (`sr_groups`), the grouped cup's later rounds (`sr_cupd`)
# (M5 #9a1).
[[unit]]
path = "src/swos_rules_post.c"
functions = ["sr_final_moves", "sr_b_teams"]
variables = []

[[unit]]
path = "src/swos_rules_cups.c"
functions = ["sr_cup_entrants"]
variables = []

[[unit]]
path = "src/swos_rules_groups.c"
functions = ["sr_pg_season"]
variables = []

[[unit]]
path = "src/swos_rules_cupd.c"
functions = ["sr_cupd_end_reset", "sr_cupd_keep_place", "sr_cupd_note_arrival", "sr_cupd_make"]
variables = []

# The fixed tiers' brackets (`sr_dplay`) and the checks of a league's rules and spec
# (`sr_check`) (M5 #9a2).
[[unit]]
path = "src/swos_rules_dplay.c"
functions = ["sr_italy", "sr_out_held", "sr_playoff_held"]
variables = []

[[unit]]
path = "src/swos_rules_check.c"
functions = ["sr_spec_check", "sr_league_check", "sr_season_check"]
variables = []

# The pack's knockouts at the season end (`sr_gplay`'s `sr_knockouts`) (M5 #9a3).
[[unit]]
path = "src/swos_rules_gplay.c"
functions = ["sr_knockouts"]
variables = []

# Upstream's RNC unpacker (the game's own, SWOS2.s): World 2026-27's foreign pool is packed, and
# `world_extract` unpacks it with this (`unpack`), so no importer reads RNC (D9).
[[unit]]
path = "src/rnc.c"
functions = ["RncDecompressV1", "RncDecompressV2"]
variables = []

# The headers whose `static inline` functions the tests call, through the wrappers bindgen
# writes for them (compiled with the units).

[[header]]
path = "include/math68k.h"
functions = ["M68kShiftLeft32", "M68kShiftLeft16"]

# Upstream's data: its globals and tables (the SWOS2.s data section, in C), linked as the units
# need them. What they reference and the oracle does not compile is defined in Rust
# (`ffi::stubs`). The globals a data file lists are bound, for the tables `world_extract` reads
# into World 1996-97's package (`tables`).

[[data]]
