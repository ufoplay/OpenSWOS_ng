[package]
name = "openswos_lint_magic"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Finds magic numbers and undocumented constants in the workspace's Rust code"

[[bin]]
name = "lint_magic"
path = "src/main.rs"

[dependencies]
proc-macro2 = { workspace = true }
syn = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
